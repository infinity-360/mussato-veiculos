name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Verificar sintaxe dos arquivos JavaScript
        run: |
          node --check server.js
          node --check test/smoke.js
          for f in public/js/*.js; do node --check "$f"; done

      - name: Testar o site (sobe o servidor e confere páginas e API)
        run: npm test
